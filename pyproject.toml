[project]
name = "kestrel"
version = "0.6.0"
description = "A fast, efficient inference engine for vision-language models"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "torch>=2.8; platform_machine != 'aarch64'",
    "torch>=2.4; platform_machine == 'aarch64'",
    "tokenizers>=0.15",
    "safetensors>=0.4",
    "torch-c-dlpack-ext>=0.1.3",
    "httpx>=0.27",
    "kestrel-native==0.1.6",
    "kestrel-kernels>=0.4.9,<0.6",
    "huggingface-hub>=0.20",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["kestrel", "kestrel.*"]
exclude = ["tests", "tests.*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
eval = [
    "datasets>=3.0",
    "tqdm>=4.66",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

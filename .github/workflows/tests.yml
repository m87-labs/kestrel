name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU test subset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep the engine's startup off the network: no telemetry key, no hub reads.
      HF_HUB_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the CPU wheels
        run: |
          python -m pip install --upgrade pip
          # The CPU torch index: the default PyPI wheel carries the CUDA
          # runtime (~2.5 GB) that a CPU-only job never loads.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          # Runtime dependencies without the CUDA kernel bundles, which are
          # GPU cubins this job cannot use.
          pip install \
            "tokenizers>=0.15" \
            "safetensors>=0.4" \
            "torch-c-dlpack-ext>=0.1.3" \
            "httpx>=0.27" \
            "huggingface-hub>=0.20" \
            "numpy>=1.26" \
            "kestrel-native==0.1.8" \
            "kestrel-kernels==0.6.2" \
            "pytest>=8.0"
          pip install --no-deps -e .

      - name: Show the environment
        run: |
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import kestrel_kernels; print('kernels', kestrel_kernels.__file__)"
          # The ternary layers arrive with a kestrel-kernels release that
          # ships kestrel_kernels/ternary.py; until then the engine tests in
          # tests/asr/test_parakeet_ternary_cpu.py skip rather than fail.
          python -c "import importlib.util as u; print('ternary layers:', u.find_spec('kestrel_kernels.ternary') is not None)"
          python -c "from kestrel.config import default_cpu_threads, physical_cpu_count; print('cores', physical_cpu_count(), 'threads', default_cpu_threads())"

      - name: Run the CPU test subset
        # Everything that runs without a GPU. The remaining suites
        # (moondream/gemma4/qwen35 runtimes, paged KV, megakernel) need CUDA.
        run: |
          pytest -q \
            tests/asr \
            tests/prefix_cache \
            tests/scheduler \
            tests/test_capability_stream.py \
            tests/test_config.py \
            tests/test_cpu_dtype_policy.py \
            tests/test_device.py \
            tests/test_engine.py \
            tests/test_model_handle.py \
            tests/test_model_registry.py \
            tests/test_multi_model.py \
            tests/test_photon.py \
            tests/test_single_pass_engine.py \
            tests/test_spec_interface.py
